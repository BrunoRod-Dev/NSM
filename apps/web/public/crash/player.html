<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Juego · NSM</title><link rel="icon" href="/nsm-icon.svg"><link rel="stylesheet" href="/crash/player.css"></head>
<body>
<header class="controls" aria-label="Menú del juego"><strong class="game-name">Juego</strong><button id="start" class="menu-command" hidden>Jugar</button><details class="player-menu"><summary>Opciones</summary><div class="player-menu-items"><button id="settings">Controles…</button><button id="sound" hidden>Activar sonido</button></div></details><details class="player-menu"><summary>Ver</summary><div class="player-menu-items"><button id="fullscreen">Pantalla completa</button></div></details><span id="seat"></span></header>
<div id="play-area"><div id="game" tabindex="0" aria-label="Pantalla del juego"><p>Preparando la partida…</p></div><div id="touch-controls" hidden aria-label="Joystick táctil"></div></div>
<p id="status" role="status">Conectando a la partida…</p>
<dialog id="controls-dialog" aria-labelledby="controls-title"><form method="dialog"><header class="dialog-titlebar"><h2 id="controls-title">Controles</h2><button aria-label="Cerrar controles">×</button></header></form><fieldset><legend>Dispositivo</legend><label>Usar <select id="device"><option value="keyboard">Teclado</option></select></label><label class="touch-option"><input id="touch-toggle" type="checkbox"> Mostrar joystick táctil</label><p id="pad-status">Presioná un botón del mando para detectarlo.</p></fieldset><fieldset><legend>Botones de tu jugador</legend><div id="bindings"></div><button id="reset-controls">Restaurar controles</button></fieldset><details class="connection-settings"><summary>Conexión y ayuda</summary><p id="instructions"></p><small id="metrics"></small><button id="share" hidden>Reintentar conexión</button><button id="tab-share" hidden>Usar audio de pestaña</button><button id="reconnect" hidden>Reconectar jugador</button></details></dialog>
<script type="module" src="/crash/player.js"></script></body></html>
