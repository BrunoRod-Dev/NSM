<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crash Bash · NSM</title><link rel="icon" href="/nsm-icon.svg"><link rel="stylesheet" href="/crash/player.css"></head>
<body>
<header class="controls"><strong>Crash Bash</strong><span id="seat"></span><button id="start" hidden>Jugar</button><button id="settings">Controles</button><button id="sound" hidden>Activar sonido</button><button id="fullscreen">Pantalla completa</button></header>
<p id="status" role="status">Conectando a la partida…</p>
<div id="game" tabindex="0" aria-label="Pantalla del juego"><p>Preparando la partida…</p></div>
<dialog id="controls-dialog" aria-labelledby="controls-title"><form method="dialog"><header><h2 id="controls-title">Tus controles</h2><button aria-label="Cerrar controles">×</button></header></form><p id="pad-status">Presioná un botón del mando para detectarlo.</p><label>Dispositivo <select id="device"><option value="keyboard">Teclado</option></select></label><p>El mando controla a tu jugador en esta ventana. Volvé al juego para activarlo.</p><div id="bindings"></div><button id="reset-controls">Restaurar controles</button><details><summary>Conexión</summary><p id="instructions"></p><small id="metrics"></small><button id="share" hidden>Reintentar conexión</button><button id="tab-share" hidden>Usar audio de pestaña</button><button id="reconnect" hidden>Reconectar jugador</button></details></dialog>
<script type="module" src="/crash/player.js"></script></body></html>
