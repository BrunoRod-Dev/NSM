services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: nsm
      POSTGRES_PASSWORD: nsm_local_only
      POSTGRES_DB: nsm
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - nsm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nsm -d nsm"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  nsm-postgres:
